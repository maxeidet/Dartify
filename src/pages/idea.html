<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BDC — Pro Scoreboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Inter:wght@400;500;600;700;800&display=swap');

        :root {
            --cream: #F8F5EC;
            --panel: #FFFFFF;
            --line: #E7E0CC;
            --forest: #1A5833;
            --forest-deep: #0F3A22;
            --gold: #BFA464;
            --gold-deep: #96793A;
            --ink: #22291F;
            --muted: #75806F;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #EDE6D2;
            display: flex;
            justify-content: center;
            padding: 32px 12px;
            font-family: 'Inter', sans-serif;
        }

        .phone {
            width: 100%;
            max-width: 400px;
            position: relative;
            background: var(--cream);
            border-radius: 28px;
            overflow: hidden;
            padding-bottom: 36px;
            box-shadow: 0 1px 0 rgba(0, 0, 0, 0.04);
        }

        /* faint paper texture */
        .phone::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                repeating-linear-gradient(0deg, rgba(15, 58, 34, 0.012) 0px, transparent 1px, transparent 3px);
            pointer-events: none;
        }

        .content {
            position: relative;
            padding: 26px 22px 0;
        }

        /* ---------- header / logo lockup ---------- */
        header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
        }

        .logo-wrap {
            width: 100%;
            max-width: 260px;
        }

        .logo-wrap img {
            width: 100%;
            height: auto;
            display: block;
        }

        .tagline {
            margin-top: 2px;
            font-family: 'Inter', sans-serif;
            font-size: 10.5px;
            font-weight: 700;
            letter-spacing: 3px;
            color: var(--gold-deep);
            text-transform: uppercase;
        }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 1.5px solid var(--forest);
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--panel);
            flex-shrink: 0;
        }

        .rule {
            margin-top: 20px;
            border: none;
            height: 1px;
            background: linear-gradient(90deg, var(--gold) 0%, var(--line) 40%, var(--line) 100%);
        }

        /* ---------- rings component (dartboard emblem, brand-tinted) ---------- */
        .rings {
            position: relative;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .rings>span {
            position: absolute;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* ---------- eyebrow ---------- */
        .eyebrow {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 26px 0 12px;
        }

        .eyebrow .tick {
            width: 14px;
            height: 2px;
            background: var(--gold-deep);
        }

        .eyebrow span {
            font-family: 'Inter', sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2.6px;
            color: var(--forest-deep);
            text-transform: uppercase;
        }

        /* ---------- stats panel ---------- */
        .stats {
            position: relative;
            background: var(--panel);
            border: 1px solid var(--line);
            border-top: 3px solid var(--forest);
            border-radius: 18px;
            padding: 20px 18px 18px;
            display: flex;
        }

        .stat {
            flex: 1;
            padding: 0 6px;
        }

        .stat+.stat {
            border-left: 1px solid var(--line);
        }

        .stat .num {
            font-family: 'Inter', sans-serif;
            font-variant-numeric: tabular-nums;
            font-weight: 800;
            font-size: 26px;
            color: var(--forest);
            display: flex;
            align-items: baseline;
            gap: 2px;
        }

        .stat .num .unit {
            font-size: 13px;
            color: var(--muted);
            font-weight: 500;
        }

        .stat.highlight .num {
            color: var(--gold-deep);
        }

        .stat .label {
            margin-top: 6px;
            font-size: 9.5px;
            font-weight: 700;
            letter-spacing: 1.6px;
            color: var(--muted);
            text-transform: uppercase;
        }

        /* ---------- play grid ---------- */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .tile {
            position: relative;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 18px 16px 16px;
            transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
            cursor: pointer;
            overflow: hidden;
        }

        .tile::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            border-radius: 20px 20px 0 0;
            background: var(--gold);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform .18s ease;
        }

        .tile:hover {
            transform: translateY(-2px);
            border-color: var(--gold);
            box-shadow: 0 6px 16px rgba(15, 58, 34, 0.08);
        }

        .tile:hover::before {
            transform: scaleX(1);
        }

        .icon-frame {
            width: 38px;
            height: 38px;
            border: 1px solid var(--line);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            background: var(--cream);
        }

        .icon-frame svg {
            width: 20px;
            height: 20px;
        }

        .tile h3 {
            font-family: 'Fraunces', serif;
            font-weight: 900;
            font-size: 19px;
            letter-spacing: 0.1px;
            color: var(--forest-deep);
        }

        .tile p {
            margin-top: 5px;
            font-size: 12px;
            color: var(--muted);
        }

        .badge {
            position: absolute;
            top: 12px;
            right: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 3px 9px 3px 7px;
            background: var(--cream);
            border: 1px solid var(--forest);
            border-radius: 20px;
        }

        .badge .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--forest);
        }

        .badge span {
            font-family: 'Inter', sans-serif;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 1.2px;
            color: var(--forest-deep);
        }

        footer {
            margin-top: 32px;
            padding-top: 16px;
            border-top: 1px solid var(--line);
            text-align: center;
        }

        footer span {
            font-family: 'Inter', sans-serif;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 2px;
            color: var(--muted);
        }
    </style>
</head>

                    <div class="icon-frame">
                        <div class="rings" id="mini-emblem" style="width:22px;height:22px;"></div>
                    </div>
                    <h3>Around Clock</h3>
                    <p>Hit 1 to 20</p>
                </div>

                <!-- CRICKET -->
                <div class="tile">
                    <div class="icon-frame">
                        <svg viewBox="0 0 24 24" fill="none" stroke="#1A5833" stroke-width="1.6" stroke-linecap="round">
                            <line x1="6" y1="5" x2="6" y2="17" />
                            <line x1="10" y1="5" x2="10" y2="17" />
                            <line x1="14" y1="5" x2="14" y2="17" />
                            <line x1="5" y1="17" x2="15" y2="5" stroke="#BFA464" />
                        </svg>
                    </div>
                    <h3>Cricket</h3>
                    <p>Close numbers</p>
                </div>

            </div>

            <footer><span>BDC SCOREBOARD &mdash; V1.0</span></footer>

        </div>
    </div>

    <script>
        function buildRings(el, size) {
            const layers = [
                { d: 1.00, c: '#BFA464' },   // gold wire
                { d: 0.88, c: '#FFFFFF' },   // white
                { d: 0.72, c: '#0F3A22' },   // forest deep
                { d: 0.56, c: '#1A5833' },   // forest
                { d: 0.42, c: '#FFFFFF' },   // white
                { d: 0.28, c: '#0F3A22' },   // forest deep
                { d: 0.15, c: '#BFA464' },   // gold bull
            ];
            el.innerHTML = '';
            layers.forEach(l => {
                const s = document.createElement('span');
                const px = size * l.d;
                s.style.width = px + 'px';
                s.style.height = px + 'px';
                s.style.background = l.c;
                el.appendChild(s);
            });
        }
        buildRings(document.getElementById('mini-emblem'), 22);
    </script>

</body>

</html>
